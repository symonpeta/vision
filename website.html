<!DOCTYPE html>
<html>
<head>
    <title>PraRoz Website</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        .main{
            width: 100%;
            height: 100vh;
            background: linear-gradient(
                rgba(0,0,0,0.5),
                rgba(0,0,0,0.5)
            ),
            url("https://images.unsplash.com/photo-1501785888041-af3ef285b470");
            background-position: center;
            background-size: cover;
        }

        .navbar{
            width: 1200px;
            height: 75px;
            margin: auto;
        }

        .logo{
            color: orange;
            font-size: 35px;
            float: left;
            padding-top: 10px;
        }

        .menu{
            float: left;
            display: flex;
        }

        .menu li{
            list-style: none;
            margin-left: 60px;
            margin-top: 27px;
            color: white;
            cursor: pointer;
        }

        .search{
            float: right;
            margin-top: 20px;
        }

        .srch{
            padding: 7px;
            border: 1px solid orange;
        }

        .btn{
            padding: 7px;
            background: orange;
            border: none;
            color: white;
            cursor: pointer;
        }

        .content{
            width: 1200px;
            margin: auto;
            color: white;
            padding-top: 150px;
        }

        .content span{
            color: orange;
            font-size: 60px;
        }

        .join{
            margin-top: 20px;
            background: orange;
            border: none;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }

        .form{
            width: 250px;
            height: 350px;
            background: rgba(0,0,0,0.8);
            position: absolute;
            top: 150px;
            right: 100px;
            padding: 25px;
            color: white;
            border-radius: 10px;
        }

        .form input{
            width: 100%;
            height: 35px;
            margin-top: 20px;
            background: transparent;
            border-bottom: 1px solid orange;
            border-top: none;
            border-left: none;
            border-right: none;
            color: white;
        }

        .loginbtn{
            width: 100%;
            margin-top: 20px;
            background: orange;
            border: none;
            padding: 10px;
            color: white;
            cursor: pointer;
        }

        .link{
            margin-top: 20px;
            text-align: center;
        }

        .link a{
            color: orange;
            text-decoration: none;
        }
    </style>

</head>
<body>

<div class="main">
    <div class="navbar">
        <div class="logo">PraRoz</div>

        <ul class="menu">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>SERVICE</li>
            <li>DESIGN</li>
            <li>CONTACT</li>
        </ul>

        <div class="search">
            <input class="srch" type="text" placeholder="Type to Search">
            <button class="btn">Search</button>
        </div>
    </div>

    <div class="content">
        <h1>Web Design & <br><span>Development</span> <br>Course</h1>
        <p class="par">
            Web Design is a specialisation of the design stream.
            They also use HTML, CSS, WYSIWYG editing software,
            mark up validators etc..
        </p>

        <button class="join">JOIN US</button>
    </div>

    <div class="form">
        <h2>Login Here</h2>
        <input type="email" placeholder="Enter Email Here">
        <input type="password" placeholder="Enter Password Here">
        <button class="loginbtn">Login</button>

        <p class="link">Don't have an account?<br>
        <a href="#">Sign up here</a></p>
    </div>
</div>

</body>
</html>
